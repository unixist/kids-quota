openapi: 3.1.0
info:
  title: kids-quota HTTP API
  version: 0.1.0
  description: |
    Implemented loopback API. Every request requires an opaque bearer token;
    scopes and child grants are enforced by the service. policy:write additionally
    requires the protected administrator credential. Read grants cannot confer
    write authority. The parent app tunnels these same requests over authenticated
    native IPC; the HTTP administrator routes are also supported. Clients cannot
    submit usage, set balances, or supply verified app signing identities.
    All responses use Cache-Control: no-store. Origin headers are rejected.
    JSON bodies are limited to 65536 bytes, with 60 requests per second per token.
    x-required-scopes documents scopes for the HTTP bearer scheme.
servers:
  - url: http://127.0.0.1:48123
    description: Loopback listener after the service is installed and started
security:
  - bearerAuth: []
paths:
  /v1/children:
    get:
      operationId: listChildren
      summary: List only children granted to this client
      x-required-scopes: ["children:read"]
      responses:
        '200':
          description: Authorized children; no OS-account identifiers
          headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
          content:
            application/json:
              schema:
                type: object
                required: [policyRevision, items]
                properties:
                  policyRevision: {$ref: '#/components/schemas/Revision'}
                  items: {type: array, items: {$ref: '#/components/schemas/Child'}}
        default: {$ref: '#/components/responses/Error'}
  /v1/services:
    get:
      operationId: listServices
      summary: List visible service definitions
      description: |
        Ordinary clients see only services assigned to granted children. A parent
        policy administrator with services:read may see the entire catalog.
      x-required-scopes: ["services:read"]
      responses:
        '200':
          description: Visible services
          headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
          content:
            application/json:
              schema:
                type: object
                required: [policyRevision, items]
                properties:
                  policyRevision: {$ref: '#/components/schemas/Revision'}
                  items: {type: array, items: {$ref: '#/components/schemas/Service'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createService
      summary: Create a custom domain and app group
      x-required-scopes: ["policy:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServiceCreate'}
      responses:
        '201': {$ref: '#/components/responses/ServiceWrite'}
        default: {$ref: '#/components/responses/Error'}
  /v1/services/{serviceId}:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    patch:
      operationId: updateService
      summary: Edit membership or name without discarding existing usage
      description: |
        Provided arrays replace prior arrays. Unspecified fields are unchanged.
        Changes affect all children assigned this service. At least one actual
        change field is required alongside expectedPolicyRevision.
      x-required-scopes: ["policy:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServicePatch'}
      responses:
        '200': {$ref: '#/components/responses/ServiceWrite'}
        default: {$ref: '#/components/responses/Error'}
  /v1/children/{childId}/quotas:
    parameters:
      - $ref: '#/components/parameters/ChildId'
    get:
      operationId: listChildQuotas
      summary: Read one authorized child's service allowances
      x-required-scopes: ["quotas:read"]
      responses:
        '200':
          description: Assigned quotas, independent from other children
          headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
          content:
            application/json:
              schema:
                type: object
                required: [policyRevision, childId, items]
                properties:
                  policyRevision: {$ref: '#/components/schemas/Revision'}
                  childId: {$ref: '#/components/schemas/Id'}
                  items: {type: array, items: {$ref: '#/components/schemas/Quota'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: assignChildQuota
      summary: Assign one service to a child with an independent allowance
      description: A duplicate child/service assignment returns 409.
      x-required-scopes: ["policy:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedPolicyRevision, serviceId, weeklyLimitSeconds]
              properties:
                expectedPolicyRevision: {$ref: '#/components/schemas/Revision'}
                serviceId: {$ref: '#/components/schemas/Id'}
                weeklyLimitSeconds: {$ref: '#/components/schemas/Seconds'}
      responses:
        '201': {$ref: '#/components/responses/QuotaWrite'}
        default: {$ref: '#/components/responses/Error'}
  /v1/children/{childId}/quotas/{quotaId}:
    parameters:
      - $ref: '#/components/parameters/ChildId'
      - $ref: '#/components/parameters/QuotaId'
    patch:
      operationId: updateChildQuota
      summary: Change the allowance while preserving current usage
      description: |
        Reducing the limit below usage exhausts the quota. Increasing it may
        restore access. The stable quota ID and service assignment do not change.
      x-required-scopes: ["policy:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedPolicyRevision, weeklyLimitSeconds]
              properties:
                expectedPolicyRevision: {$ref: '#/components/schemas/Revision'}
                weeklyLimitSeconds: {$ref: '#/components/schemas/Seconds'}
      responses:
        '200': {$ref: '#/components/responses/QuotaWrite'}
        default: {$ref: '#/components/responses/Error'}
  /v1/children/{childId}/balances:
    parameters:
      - $ref: '#/components/parameters/ChildId'
    get:
      operationId: readChildBalances
      summary: Read current balances, including live foreground elapsed time
      description: |
        Reads do not grant time or reset the ledger. The service computes the
        current calendar period before answering. Clients display asOf and mark
        stale or failed reads accordingly; polling does not drive enforcement.
      x-required-scopes: ["balances:read"]
      responses:
        '200':
          description: A consistent snapshot for the authorized child
          headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BalanceSnapshot'}
              example:
                asOf: '2026-10-23T20:00:00Z'
                policyRevision: 7
                childId: child-1
                items:
                  - quotaId: child-1-chesscom
                    serviceId: chesscom
                    periodStart: '2026-10-19T05:00:00Z'
                    periodEnd: '2026-10-26T05:00:00Z'
                    limitSeconds: 21600
                    usedSeconds: 7200
                    remainingSeconds: 14400
                    quotaState: available
                    coverage: complete
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/state:
    get:
      operationId: readAdministrativeState
      summary: Read full policy, public client grants, and filter status
      x-required-scopes: ["policy:write"]
      responses:
        '200':
          description: Administrator-only state; tokens and credential digests are omitted
          content:
            application/json:
              schema:
                type: object
                required: [policyRevision, policy, clients, filterConnected, unattributedFlows]
                properties:
                  policyRevision: {$ref: '#/components/schemas/Revision'}
                  policy: {$ref: '#/components/schemas/Policy'}
                  clients: {type: array, items: {$ref: '#/components/schemas/ClientGrant'}}
                  filterConnected: {type: boolean}
                  unattributedFlows: {type: integer, minimum: 0}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/children:
    post:
      operationId: createChild
      summary: Verify the selected macOS account and create its child profile
      description: Assigns default six-hour Chess.com and ChatGPT quotas when those presets exist.
      x-required-scopes: ["policy:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedPolicyRevision, displayName, generatedUid]
              properties:
                expectedPolicyRevision: {$ref: '#/components/schemas/Revision'}
                displayName: {type: string, minLength: 1, maxLength: 100}
                generatedUid: {type: string, minLength: 1, description: Selected account GeneratedUID; independently resolved by the service.}
                uid: {type: integer, minimum: 0, maximum: 4294967295, description: Optional consistency check against the resolved account.}
      responses:
        '201':
          description: Verified account paired and initial quotas created
          content:
            application/json:
              schema:
                type: object
                required: [policyRevision, child]
                properties:
                  policyRevision: {$ref: '#/components/schemas/Revision'}
                  child: {$ref: '#/components/schemas/Child'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/applications:
    post:
      operationId: verifyApplication
      summary: Inspect an installed app and return its verified signing binding
      description: |
        Accepts a selected local app path. Signing identity, designated requirement,
        and readiness are derived by the daemon and cannot be supplied by clients.
        An existing signing identity is returned without a policy mutation.
      x-required-scopes: ["policy:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedPolicyRevision, path]
              properties:
                expectedPolicyRevision: {$ref: '#/components/schemas/Revision'}
                path: {type: string, minLength: 1, example: /Applications/ChatGPT.app}
      responses:
        '201': {$ref: '#/components/responses/ApplicationWrite'}
        '200': {$ref: '#/components/responses/ApplicationWrite'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/settings:
    put:
      operationId: updateResetSchedule
      summary: Schedule a new household reset day, time, and timezone
      description: Takes effect at the existing period end; does not refill current balances.
      x-required-scopes: ["policy:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedPolicyRevision, reset]
              properties:
                expectedPolicyRevision: {$ref: '#/components/schemas/Revision'}
                reset: {$ref: '#/components/schemas/ResetSchedule'}
      responses:
        '200':
          description: Policy saved with a pending reset schedule when changed
          content:
            application/json:
              schema:
                type: object
                required: [policyRevision, policy]
                properties:
                  policyRevision: {$ref: '#/components/schemas/Revision'}
                  policy: {$ref: '#/components/schemas/Policy'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/clients:
    post:
      operationId: issueReadCredential
      summary: Issue a read-only token for explicitly granted children
      description: Does not require or change policyRevision. The plaintext token is returned once.
      x-required-scopes: ["policy:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, scopes, childIds]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                scopes:
                  type: array
                  minItems: 1
                  items: {$ref: '#/components/schemas/ReadScope'}
                childIds:
                  type: array
                  minItems: 1
                  items: {$ref: '#/components/schemas/Id'}
      responses:
        '201':
          description: Created read credential; securely store the token before dismissing it
          content:
            application/json:
              schema:
                type: object
                required: [id, token, client]
                properties:
                  id: {$ref: '#/components/schemas/Id'}
                  token: {type: string, description: Opaque bearer secret; not returned by later reads.}
                  client: {$ref: '#/components/schemas/ClientGrant'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/clients/{clientId}:
    parameters:
      - name: clientId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
    delete:
      operationId: revokeReadCredential
      summary: Revoke a previously issued read token
      description: Does not require or change policyRevision. The administrator credential is protected.
      x-required-scopes: ["policy:write"]
      responses:
        '200':
          description: Revocation persisted and effective immediately
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: {type: boolean, const: true}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Revocable token issued through parent-approved client setup. Required
        even on loopback. Each token carries explicit scopes and child grants;
        callers cannot broaden grants by changing a path or request body.
  headers:
    NoStore:
      description: Child and policy data must not be cached by intermediaries.
      schema: {type: string, const: no-store}
  parameters:
    ChildId:
      name: childId
      in: path
      required: true
      description: Must be granted to the caller; unauthorized IDs return 404.
      schema: {$ref: '#/components/schemas/Id'}
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    QuotaId:
      name: quotaId
      in: path
      required: true
      description: Must belong to the child in this path.
      schema: {$ref: '#/components/schemas/Id'}
  responses:
    Error:
      description: |
        400 malformed request; 401 missing/invalid token; 403 missing scope;
        404 absent or unauthorized resource; 409 stale revision or duplicate
        assignment; 422 invalid policy; 429 rate limited; 503 unavailable.
        No unrelated child, credential, or OS-account details are disclosed.
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code:
                    type: string
                    enum: [bad_request, unauthenticated, forbidden, not_found, conflict, invalid_policy, rate_limited, unavailable]
                  message: {type: string}
    ServiceWrite:
      description: Service saved transactionally; revision advanced
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/json:
          schema:
            type: object
            required: [policyRevision, service]
            properties:
              policyRevision: {$ref: '#/components/schemas/Revision'}
              service: {$ref: '#/components/schemas/Service'}
    QuotaWrite:
      description: Quota saved transactionally; existing usage retained
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content:
        application/json:
          schema:
            type: object
            required: [policyRevision, quota]
            properties:
              policyRevision: {$ref: '#/components/schemas/Revision'}
              quota: {$ref: '#/components/schemas/Quota'}
    ApplicationWrite:
      description: Verified app binding; 201 for a new binding, 200 for an existing identity
      content:
        application/json:
          schema:
            type: object
            required: [policyRevision, application]
            properties:
              policyRevision: {$ref: '#/components/schemas/Revision'}
              application: {$ref: '#/components/schemas/ApplicationBinding'}
  schemas:
    ReadScope:
      type: string
      enum: ['children:read', 'services:read', 'quotas:read', 'balances:read']
    ClientGrant:
      type: object
      required: [id, name, scopes, childIds, administrator]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
        scopes: {type: array, items: {type: string}}
        childIds: {type: array, items: {$ref: '#/components/schemas/Id'}}
        administrator: {type: boolean}
      description: Public metadata only; plaintext tokens and digests are never included.
    ResetSchedule:
      type: object
      required: [weekday, localTime, timeZone]
      properties:
        weekday: {type: string, enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]}
        localTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '00:00'}
        timeZone: {type: string, example: America/Chicago, description: IANA timezone identifier.}
    AccountBinding:
      type: object
      required: [status]
      properties:
        status: {type: string}
        generatedUid: {type: string}
        uid: {type: integer, minimum: 0, maximum: 4294967295}
      description: Administrative data; not exposed in ordinary child list responses.
    ApplicationIdentity:
      type: object
      required: [signingIdentifier, designatedRequirement]
      properties:
        signingIdentifier: {type: string}
        teamIdentifier: {type: string}
        designatedRequirement: {type: string}
        executablePath: {type: string}
      description: Derived from the app signature by the service, never accepted from a client.
    ApplicationBinding:
      type: object
      required: [id, displayName, status]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        displayName: {type: string}
        status: {type: string}
        identity: {$ref: '#/components/schemas/ApplicationIdentity'}
    Policy:
      type: object
      required: [schemaVersion, revision, reset, metering, enforcement, api, children, applicationBindings, services, quotas]
      properties:
        schemaVersion: {type: integer, const: 2}
        revision: {$ref: '#/components/schemas/Revision'}
        reset: {$ref: '#/components/schemas/ResetSchedule'}
        pendingReset:
          type: object
          required: [schedule, effectiveAt]
          properties:
            schedule: {$ref: '#/components/schemas/ResetSchedule'}
            effectiveAt: {type: string, format: date-time}
        metering:
          type: object
          properties:
            mode: {type: string, const: foreground-activity}
            countPassiveViewing: {type: boolean, const: true}
            countBackgroundMedia: {type: boolean, const: false}
            pauseWhenLocked: {type: boolean, const: true}
            pauseWhenAsleep: {type: boolean, const: true}
        enforcement:
          type: object
          properties:
            websites: {type: string, const: browser-extension}
            applications: {type: string, const: network-content-filter}
        api:
          type: object
          properties:
            bindAddress: {type: string, const: '127.0.0.1'}
            port: {type: integer, minimum: 1024, maximum: 65535}
            basePath: {type: string, const: /v1}
            authentication: {type: string, const: scoped-bearer-token}
            allowedBrowserOrigins: {type: array, items: {type: string}}
        children:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Child'
              - type: object
                required: [macOSAccount]
                properties:
                  macOSAccount: {$ref: '#/components/schemas/AccountBinding'}
        applicationBindings: {type: array, items: {$ref: '#/components/schemas/ApplicationBinding'}}
        services: {type: array, items: {$ref: '#/components/schemas/Service'}}
        quotas: {type: array, items: {$ref: '#/components/schemas/Quota'}}
    Id:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
      description: Stable opaque identifier. Example slugs are illustrative.
    Revision:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    Seconds:
      type: integer
      minimum: 0
      maximum: 604800000
      description: Integer seconds. Zero allowance means exhausted immediately.
    Child:
      type: object
      required: [id, displayName]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        displayName: {type: string, minLength: 1, maxLength: 100}
    Domain:
      type: object
      additionalProperties: false
      required: [hostname, includeSubdomains]
      properties:
        hostname:
          type: string
          format: hostname
          maxLength: 253
          description: |
            Canonical lowercase ASCII/IDNA hostname. No scheme, path, wildcard,
            IP literal, or bare public suffix. Semantic validation is required.
        includeSubdomains: {type: boolean}
    DomainInput:
      type: object
      additionalProperties: false
      required: [hostname, includeSubdomains]
      properties:
        hostname:
          type: string
          minLength: 1
          description: Hostname or HTTP(S) website address; the service canonicalizes the host and rejects IPs and public suffixes.
        includeSubdomains: {type: boolean}
    Service:
      type: object
      required: [id, name, domains, applicationIds]
      anyOf:
        - properties: {domains: {minItems: 1}}
        - properties: {applicationIds: {minItems: 1}}
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string, minLength: 1, maxLength: 100}
        domains:
          type: array
          items: {$ref: '#/components/schemas/Domain'}
        applicationIds:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Id'}
      description: At least one domain or existing logical application binding is required.
    ServiceCreate:
      type: object
      additionalProperties: false
      required: [expectedPolicyRevision, name, domains, applicationIds]
      anyOf:
        - properties: {domains: {minItems: 1}}
        - properties: {applicationIds: {minItems: 1}}
      properties:
        expectedPolicyRevision: {$ref: '#/components/schemas/Revision'}
        name: {type: string, minLength: 1, maxLength: 100}
        domains: {type: array, items: {$ref: '#/components/schemas/DomainInput'}}
        applicationIds:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Id'}
      description: |
        Server assigns the ID. At least one domain or application binding must
        remain. Unknown bindings and ambiguous overlapping policy return 422.
        Clients cannot supply signing identities; native setup owns verification.
    ServicePatch:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [expectedPolicyRevision]
      properties:
        expectedPolicyRevision: {$ref: '#/components/schemas/Revision'}
        name: {type: string, minLength: 1, maxLength: 100}
        domains: {type: array, items: {$ref: '#/components/schemas/DomainInput'}}
        applicationIds:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Id'}
      description: Validate the resulting service and every affected child's policy.
    Quota:
      type: object
      required: [id, childId, serviceId, weeklyLimitSeconds]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        childId: {$ref: '#/components/schemas/Id'}
        serviceId: {$ref: '#/components/schemas/Id'}
        weeklyLimitSeconds: {$ref: '#/components/schemas/Seconds'}
    Balance:
      type: object
      required: [quotaId, serviceId, periodStart, periodEnd, limitSeconds, usedSeconds, remainingSeconds, quotaState, coverage]
      properties:
        quotaId: {$ref: '#/components/schemas/Id'}
        serviceId: {$ref: '#/components/schemas/Id'}
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time}
        limitSeconds: {$ref: '#/components/schemas/Seconds'}
        usedSeconds: {$ref: '#/components/schemas/Seconds'}
        remainingSeconds: {$ref: '#/components/schemas/Seconds'}
        quotaState: {type: string, enum: [available, exhausted]}
        coverage: {type: string, enum: [complete, incomplete]}
      description: |
        remainingSeconds = max(0, limitSeconds - usedSeconds). Exhausted iff
        remainingSeconds is zero. Coverage is independent of quota state and
        reports whether the assigned account, apps, browsers, and filter are ready.
    BalanceSnapshot:
      type: object
      required: [asOf, policyRevision, childId, items]
      properties:
        asOf: {type: string, format: date-time}
        policyRevision: {$ref: '#/components/schemas/Revision'}
        childId: {$ref: '#/components/schemas/Id'}
        items: {type: array, items: {$ref: '#/components/schemas/Balance'}}
