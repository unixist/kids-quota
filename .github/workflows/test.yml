name: Test
on: [push, pull_request]
jobs:
  phone-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix cloud
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Swift core and service tests
        run: |
          if swift test > "$RUNNER_TEMP/kids-quota-swift.log" 2>&1; then
            cat "$RUNNER_TEMP/kids-quota-swift.log"
          else
            cat "$RUNNER_TEMP/kids-quota-swift.log"
            python3 - "$RUNNER_TEMP/kids-quota-swift.log" <<'PY'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          errors = [line for line in lines if re.search(r"\berror:|Test Case .* failed|threw error", line)]
          for line in (errors or [line for line in lines if line.strip()])[-10:]:
              message = line[:600].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Swift test failure::{message}")
          PY
            exit 1
          fi
      - run: swift test --package-path ios/QuotaKit
      - run: npm test
      - run: python3 -m unittest discover -s Tests/packaging
      - run: npm run build:extensions
      - run: python3 scripts/smoke-service.py
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project KidsQuota.xcodeproj -scheme KidsQuota -destination 'platform=macOS' -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project KidsQuota.xcodeproj -scheme KidsQuotaMacTests -destination 'platform=macOS' -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO test
      - run: scripts/build-ios.sh
      - name: Test iPhone connection and refresh behavior
        shell: bash
        run: |
          simulator_id="$(python3 - <<'PY'
          import json, re, subprocess
          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"]
          ))["devices"]
          candidates = []
          for runtime, entries in devices.items():
              match = re.fullmatch(r"com\.apple\.CoreSimulator\.SimRuntime\.iOS-(\d+(?:-\d+)*)", runtime)
              if not match:
                  continue
              version = tuple(int(part) for part in match.group(1).split("-"))
              if version < (17,):
                  continue
              for device in entries:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator with iOS 17 or newer.")
          print(max(candidates)[2])
          PY
          )"
          xcodebuild -project ios/KidsQuotaPhone.xcodeproj -scheme KidsQuotaPhone \
            -configuration Debug -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath dist/ios-simulator CODE_SIGNING_ALLOWED=NO test
